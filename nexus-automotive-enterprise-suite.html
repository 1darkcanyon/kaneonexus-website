<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEXUS — Automotive & Enterprise Intelligence Suite</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel for in-browser JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    @keyframes spinSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes spinReverse {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    .animate-spin-slow {
      animation: spinSlow 24s linear infinite;
    }
    .animate-spin-reverse {
      animation: spinReverse 18s linear infinite;
    }
    body {
      background-color: #050b14;
      color: #f8fafc;
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Lightweight Lucide Icon wrapper for standalone HTML
    const Icon = ({ name, className = "w-5 h-5" }) => {
      const ref = useRef(null);
      useEffect(() => {
        if (ref.current && window.lucide) {
          ref.current.innerHTML = '';
          const iconEl = document.createElement('i');
          iconEl.setAttribute('data-lucide', name);
          iconEl.className = className;
          ref.current.appendChild(iconEl);
          window.lucide.createIcons({ root: ref.current });
        }
      }, [name, className]);
      return <span ref={ref} className="inline-flex items-center justify-center"></span>;
    };

    // ==========================================
    // MODULE 1: NEXUS COMMAND TELEMETRY
    // ==========================================
    function CommandTelemetryModule() {
      const [secStatus, setSecStatus] = useState('LOCKED');
      const [protoSync, setProtoSync] = useState(97);
      const [sysAlert, setSysAlert] = useState('CLEAR');
      const [syncHistory, setSyncHistory] = useState([88, 91, 94, 96, 95, 98, 97]);
      const [coreLoads, setCoreLoads] = useState([
        { name: 'Core 1 · Neural Kernel', load: 54 },
        { name: 'Core 2 · Vision / LiDAR', load: 72 },
        { name: 'Core 3 · Guardian Biometrics', load: 61 },
        { name: 'Core 4 · Memoria Graph', load: 48 },
        { name: 'Core 5 · Knox Enclave', load: 83 },
      ]);

      useEffect(() => {
        const interval = setInterval(() => {
          const statuses = ['LOCKED', 'LOCKED', 'SCANNING', 'LOCKED', 'VERIFYING'];
          setSecStatus(statuses[Math.floor(Math.random() * statuses.length)]);

          const nextSync = 93 + Math.floor(Math.random() * 7);
          setProtoSync(nextSync);
          setSyncHistory((prev) => [...prev.slice(1), nextSync]);

          setCoreLoads((prev) =>
            prev.map((core, idx) =>
              idx === Math.floor(Math.random() * prev.length)
                ? { ...core, load: 42 + Math.floor(Math.random() * 52) }
                : core
            )
          );
        }, 3500);
        return () => clearInterval(interval);
      }, []);

      const triggerTestAnomaly = () => {
        setSysAlert('ANOMALY DETECTED');
        setTimeout(() => setSysAlert('CLEAR'), 3000);
      };

      const timeLabels = ['-6m', '-5m', '-4m', '-3m', '-2m', '-1m', 'NOW'];

      return (
        <div className="space-y-6">
          {/* Top Neural Sync HUD */}
          <div className="relative overflow-hidden rounded-2xl border border-cyan-500/30 bg-gradient-to-br from-[#0d222b] via-[#081520] to-[#050b14] p-8 shadow-[0_0_40px_rgba(6,182,212,0.15)]">
            <div className="flex flex-col md:flex-row items-center justify-between gap-6">
              <div className="flex items-center space-x-6">
                <div className="relative flex items-center justify-center w-28 h-28">
                  <div className="absolute inset-0 rounded-full border-2 border-cyan-400/50 animate-ping" style={{ animationDuration: '3s' }}></div>
                  <div className="absolute inset-2 rounded-full border border-dashed border-cyan-300/60 animate-spin-slow"></div>
                  <div className="relative z-10 flex flex-col items-center justify-center w-20 h-20 rounded-full bg-cyan-950/80 border border-cyan-400/60 shadow-[0_0_20px_rgba(34,211,238,0.4)]">
                    <Icon name="cpu" className="w-7 h-7 text-cyan-300" />
                    <span className="text-[10px] font-mono text-cyan-300 mt-1">SYNC</span>
                  </div>
                </div>
                <div>
                  <div className="inline-flex items-center space-x-2 px-2.5 py-0.5 rounded-full bg-cyan-500/10 border border-cyan-400/30 text-cyan-300 text-xs font-mono mb-2">
                    <span className="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span>
                    <span>SOVEREIGN ARCHITECTURE ONLINE</span>
                  </div>
                  <h2 className="text-2xl md:text-3xl font-bold tracking-wider text-white uppercase">
                    Neural Sync Active
                  </h2>
                  <p className="text-slate-400 text-sm mt-1">
                    EIAIO Kernel • Samsung Knox Enterprise Enclave • Multi-Vehicle Mesh
                  </p>
                </div>
              </div>

              <div className="flex flex-col sm:flex-row gap-3">
                <button
                  onClick={triggerTestAnomaly}
                  className="px-4 py-2.5 rounded-lg bg-cyan-500/10 hover:bg-cyan-500/20 border border-cyan-400/40 text-cyan-300 text-xs font-mono uppercase tracking-wider transition cursor-pointer"
                >
                  Simulate Telemetry Ping
                </button>
              </div>
            </div>
          </div>

          {/* 3 Status KPIs */}
          <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div className="rounded-xl border border-cyan-500/25 bg-[#091522] p-5 shadow-lg">
              <div className="flex items-center justify-between text-xs font-mono text-cyan-400/80 uppercase tracking-widest mb-2">
                <span>Security Status</span>
                <Icon name="lock" className="w-4 h-4 text-cyan-400" />
              </div>
              <div className="text-2xl font-bold font-mono text-cyan-300">{secStatus}</div>
              <div className="text-xs text-slate-400 mt-1">Hardware-backed attestation active</div>
            </div>

            <div className="rounded-xl border border-cyan-500/25 bg-[#091522] p-5 shadow-lg">
              <div className="flex items-center justify-between text-xs font-mono text-cyan-400/80 uppercase tracking-widest mb-2">
                <span>Protocol Sync</span>
                <Icon name="radio" className="w-4 h-4 text-emerald-400" />
              </div>
              <div className="text-2xl font-bold font-mono text-emerald-400">{protoSync}%</div>
              <div className="text-xs text-slate-400 mt-1">Zero-latency edge state replication</div>
            </div>

            <div className={`rounded-xl border p-5 shadow-lg transition-colors ${
              sysAlert === 'CLEAR'
                ? 'border-cyan-500/25 bg-[#091522]'
                : 'border-rose-500 bg-rose-950/40'
            }`}>
              <div className="flex items-center justify-between text-xs font-mono text-cyan-400/80 uppercase tracking-widest mb-2">
                <span>System Alert</span>
                <Icon name="shield" className={`w-4 h-4 ${sysAlert === 'CLEAR' ? 'text-cyan-400' : 'text-rose-400 animate-bounce'}`} />
              </div>
              <div className={`text-2xl font-bold font-mono ${sysAlert === 'CLEAR' ? 'text-cyan-300' : 'text-rose-400'}`}>
                {sysAlert}
              </div>
              <div className="text-xs text-slate-400 mt-1">
                {sysAlert === 'CLEAR' ? 'All behavioral & CAN-bus channels nominal' : 'Isolating external packet anomaly'}
              </div>
            </div>
          </div>

          {/* Telemetry Charts */}
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
            {/* Sync History Bar/Line Visualizer */}
            <div className="rounded-xl border border-cyan-500/25 bg-[#091522] p-6">
              <div className="flex items-center justify-between mb-6">
                <div>
                  <h3 className="text-sm font-mono uppercase tracking-widest text-cyan-300">Protocol Sync History</h3>
                  <p className="text-xs text-slate-400">Rolling 7-minute fleet & edge node cohesion</p>
                </div>
                <span className="text-xs font-mono text-emerald-400 bg-emerald-950/60 border border-emerald-500/30 px-2.5 py-1 rounded">
                  AVG {Math.round(syncHistory.reduce((a, b) => a + b, 0) / syncHistory.length)}%
                </span>
              </div>

              <div className="h-48 flex items-end justify-between gap-3 pt-6 px-2 border-b border-slate-800">
                {syncHistory.map((val, idx) => (
                  <div key={idx} className="flex-1 flex flex-col items-center h-full justify-end group">
                    <span className="text-[11px] font-mono text-cyan-300 mb-1.5 opacity-80 group-hover:opacity-100">
                      {val}%
                    </span>
                    <div
                      className="w-full max-w-[38px] rounded-t-md bg-gradient-to-t from-cyan-600/40 to-cyan-400 border-t-2 border-cyan-200 transition-all duration-500"
                      style={{ height: `${val}%` }}
                    ></div>
                  </div>
                ))}
              </div>
              <div className="flex justify-between px-2 pt-2 text-[11px] font-mono text-slate-400">
                {timeLabels.map((lbl, i) => (
                  <span key={i} className="flex-1 text-center">{lbl}</span>
                ))}
              </div>
            </div>

            {/* Neural Core Load Distribution */}
            <div className="rounded-xl border border-cyan-500/25 bg-[#091522] p-6">
              <div className="flex items-center justify-between mb-6">
                <div>
                  <h3 className="text-sm font-mono uppercase tracking-widest text-cyan-300">Neural Core Load Distribution</h3>
                  <p className="text-xs text-slate-400">Real-time compute allocation across active subsystems</p>
                </div>
                <span className="text-xs font-mono text-cyan-300 bg-cyan-950/60 border border-cyan-500/30 px-2.5 py-1 rounded">
                  5 CORES ACTIVE
                </span>
              </div>

              <div className="space-y-4">
                {coreLoads.map((core, idx) => (
                  <div key={idx}>
                    <div className="flex justify-between text-xs font-mono mb-1.5">
                      <span className="text-slate-300">{core.name}</span>
                      <span className={core.load > 80 ? 'text-amber-400' : 'text-cyan-300'}>{core.load}%</span>
                    </div>
                    <div className="w-full h-2.5 bg-slate-800 rounded-full overflow-hidden">
                      <div
                        className={`h-full rounded-full transition-all duration-500 ${
                          core.load > 80
                            ? 'bg-gradient-to-r from-cyan-400 to-amber-400'
                            : 'bg-gradient-to-r from-teal-500 to-cyan-400'
                        }`}
                        style={{ width: `${core.load}%` }}
                      ></div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // MODULE 2: ACTIVE HAZARD HUD (WITH TRIGGERS)
    // ==========================================
    function HazardHudModule() {
      const [points, setPoints] = useState(2847);
      const [currentSpeed, setCurrentSpeed] = useState(45);
      const [speedLimit] = useState(45);
      const [hazardDetected, setHazardDetected] = useState(null);
      const [activeTab, setActiveTab] = useState('vehicle');
      const [autoSim, setAutoSim] = useState(true);

      const presetHazards = [
        { id: 'deer', label: 'Deer Crossing', icon: '🦌', distance: '180 ft', severity: 'high', action: 'Pre-charging brake hydraulics & acoustic alert' },
        { id: 'pedestrian', label: 'Unseen Pedestrian', icon: '🚶', distance: '95 ft', severity: 'high', action: 'Autonomous emergency braking armed' },
        { id: 'pothole', label: 'Deep Road Hazard', icon: '🕳️', distance: '140 ft', severity: 'medium', action: 'Active suspension damping & lane bias adjusted' },
        { id: 'debris', label: 'Highway Debris', icon: '⚠️', distance: '260 ft', severity: 'low', action: 'Trajectory pathing plotted around obstruction' },
      ];

      useEffect(() => {
        if (!autoSim) return;
        const interval = setInterval(() => {
          setCurrentSpeed((prev) => {
            const delta = (Math.random() - 0.48) * 2.2;
            const next = Math.max(38, Math.min(48, prev + delta));
            return next;
          });
        }, 1800);
        return () => clearInterval(interval);
      }, [autoSim]);

      const triggerHazard = (hazard) => {
        setHazardDetected(hazard);
        setPoints((p) => p + 25);
      };

      const triggerSpeedBurst = () => {
        setAutoSim(false);
        setCurrentSpeed(64);
        setTimeout(() => {
          setCurrentSpeed(45);
          setAutoSim(true);
        }, 3500);
      };

      const getSpeedColor = () => {
        const diff = currentSpeed - speedLimit;
        if (diff <= 0) return 'text-emerald-400';
        if (diff <= 5) return 'text-amber-400';
        return 'text-rose-500';
      };

      return (
        <div className="space-y-4">
          {/* Presenter Control Bar */}
          <div className="rounded-xl border border-cyan-500/30 bg-[#091726] p-4 flex flex-wrap items-center justify-between gap-3">
            <div className="flex items-center space-x-2">
              <span className="px-2 py-0.5 rounded bg-cyan-500/20 text-cyan-300 font-mono text-xs font-bold">
                LIVE DEMO TRIGGERS
              </span>
              <span className="text-xs text-slate-400 hidden sm:inline">
                Click any scenario to test instant HUD response:
              </span>
            </div>
            <div className="flex flex-wrap gap-2">
              {presetHazards.map((h) => (
                <button
                  key={h.id}
                  onClick={() => triggerHazard(h)}
                  className="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-600 text-xs font-mono text-white flex items-center space-x-1.5 transition cursor-pointer"
                >
                  <span>{h.icon}</span>
                  <span>{h.label}</span>
                </button>
              ))}
              <button
                onClick={triggerSpeedBurst}
                className="px-3 py-1.5 rounded-lg bg-rose-950/70 hover:bg-rose-900/70 border border-rose-500/50 text-xs font-mono text-rose-300 flex items-center space-x-1.5 transition cursor-pointer"
              >
                <Icon name="gauge" className="w-3.5 h-3.5" />
                <span>Speed Surge</span>
              </button>
              {hazardDetected && (
                <button
                  onClick={() => setHazardDetected(null)}
                  className="px-3 py-1.5 rounded-lg bg-cyan-900/50 hover:bg-cyan-800/50 border border-cyan-400/50 text-xs font-mono text-cyan-200 cursor-pointer"
                >
                  Clear Alert
                </button>
              )}
            </div>
          </div>

          {/* Main HUD Frame */}
          <div className="relative rounded-2xl border border-slate-800 bg-gradient-to-b from-[#070d17] to-[#03060c] p-6 font-mono overflow-hidden shadow-2xl">
            <div className="h-1 w-full bg-gradient-to-r from-cyan-500 via-blue-500 to-emerald-500 opacity-50 absolute top-0 left-0"></div>

            {/* HUD Top Bar */}
            <div className="flex justify-between items-center mb-6">
              <div className="flex items-center space-x-4">
                <div className="flex items-center space-x-2 bg-rose-950/60 border border-rose-500/30 px-2.5 py-1 rounded">
                  <div className="w-2.5 h-2.5 bg-rose-500 rounded-full animate-pulse"></div>
                  <span className="text-rose-400 text-xs font-bold">BLACKBOX REC</span>
                </div>
                <div className="text-emerald-400 text-xs bg-emerald-950/50 border border-emerald-500/30 px-2.5 py-1 rounded">
                  GPS + RTK: LOCKED
                </div>
              </div>
              <div className="flex items-center space-x-2 bg-amber-950/40 border border-amber-500/30 px-3 py-1 rounded-full">
                <Icon name="award" className="w-4 h-4 text-amber-400" />
                <span className="text-amber-300 text-sm font-bold">{points.toLocaleString()} PTS</span>
              </div>
            </div>

            {/* Active Hazard Alert Banner */}
            {hazardDetected && (
              <div className={`mb-6 p-5 rounded-xl border-2 transition-all ${
                hazardDetected.severity === 'high'
                  ? 'bg-rose-950/85 border-rose-500 shadow-[0_0_30px_rgba(244,63,94,0.35)]'
                  : hazardDetected.severity === 'medium'
                  ? 'bg-amber-950/85 border-amber-500 shadow-[0_0_25px_rgba(245,158,11,0.3)]'
                  : 'bg-cyan-950/85 border-cyan-400 shadow-[0_0_25px_rgba(34,211,238,0.3)]'
              }`}>
                <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                  <div className="flex items-center space-x-4">
                    <span className="text-4xl">{hazardDetected.icon}</span>
                    <div>
                      <div className="flex items-center space-x-2">
                        <span className="text-xs uppercase px-2 py-0.5 rounded bg-black/40 text-white font-bold">
                          {hazardDetected.severity} priority
                        </span>
                        <span className="text-xs text-slate-300">Range: {hazardDetected.distance}</span>
                      </div>
                      <h3 className="text-xl font-bold text-white mt-1">
                        {hazardDetected.label} Detected
                      </h3>
                      <p className="text-xs text-cyan-200 mt-0.5">{hazardDetected.action}</p>
                    </div>
                  </div>
                  <button
                    onClick={() => setHazardDetected(null)}
                    className="px-3 py-1.5 rounded bg-black/40 hover:bg-black/60 text-xs text-white border border-white/20 cursor-pointer"
                  >
                    Acknowledge
                  </button>
                </div>
              </div>
            )}

            {/* Center Speedometer & Telemetry */}
            <div className="flex flex-col items-center justify-center py-4 space-y-6">
              <div className="relative">
                <div className="w-56 h-56 rounded-full border-8 border-slate-800 flex items-center justify-center relative bg-gradient-to-br from-slate-900 to-black shadow-[inset_0_0_30px_rgba(0,0,0,0.9)]">
                  <div className="text-center">
                    <div className={`text-6xl font-bold tracking-tight ${getSpeedColor()}`}>
                      {Math.round(currentSpeed)}
                    </div>
                    <div className="text-slate-400 text-sm tracking-widest mt-1">MPH</div>
                    <div className="text-xs text-cyan-400/80 mt-2 px-2.5 py-0.5 rounded bg-cyan-950/50 border border-cyan-500/20">
                      LIMIT {speedLimit}
                    </div>
                  </div>
                </div>

                {/* Compliance Badge */}
                <div className="absolute -top-1 -right-1">
                  {currentSpeed <= speedLimit ? (
                    <div className="w-12 h-12 bg-emerald-500 rounded-full flex items-center justify-center shadow-[0_0_15px_rgba(16,185,129,0.6)]">
                      <Icon name="shield" className="w-6 h-6 text-slate-950" />
                    </div>
                  ) : (
                    <div className="w-12 h-12 bg-rose-500 rounded-full flex items-center justify-center animate-bounce shadow-[0_0_20px_rgba(244,63,94,0.8)]">
                      <Icon name="alert-triangle" className="w-6 h-6 text-white" />
                    </div>
                  )}
                </div>
              </div>

              {/* Sub-tab Dynamic Content */}
              {activeTab === 'vehicle' && (
                <div className="grid grid-cols-3 gap-3 w-full max-w-lg">
                  <div className="bg-slate-900/90 p-3.5 rounded-xl text-center border border-slate-800">
                    <Icon name="eye" className="w-5 h-5 text-cyan-400 mx-auto mb-1.5" />
                    <div className="text-xs text-slate-400">360° Vision</div>
                    <div className="text-emerald-400 text-sm font-bold">CLEAR</div>
                  </div>
                  <div className="bg-slate-900/90 p-3.5 rounded-xl text-center border border-slate-800">
                    <Icon name="navigation" className="w-5 h-5 text-blue-400 mx-auto mb-1.5" />
                    <div className="text-xs text-slate-400">Lane Hold</div>
                    <div className="text-emerald-400 text-sm font-bold">LOCKED</div>
                  </div>
                  <div className="bg-slate-900/90 p-3.5 rounded-xl text-center border border-slate-800">
                    <Icon name="zap" className="w-5 h-5 text-amber-400 mx-auto mb-1.5" />
                    <div className="text-xs text-slate-400">Latency</div>
                    <div className="text-emerald-400 text-sm font-bold">14 ms</div>
                  </div>
                </div>
              )}

              {activeTab === 'rights' && (
                <div className="w-full max-w-lg bg-slate-900/90 border border-cyan-500/30 rounded-xl p-4 text-xs space-y-2">
                  <div className="text-cyan-300 font-bold uppercase tracking-wider">Constitutional & Telemetry Vault</div>
                  <p className="text-slate-300">
                    Local edge encryption active. Zero cloud streaming without owner cryptographic key. Automated traffic-stop timestamp & speed compliance log ready.
                  </p>
                </div>
              )}

              {activeTab === 'scanner' && (
                <div className="w-full max-w-lg bg-slate-900/90 border border-purple-500/30 rounded-xl p-4 text-xs space-y-2">
                  <div className="text-purple-300 font-bold uppercase tracking-wider">V2X & RF Spectrum Perimeter</div>
                  <p className="text-slate-300">
                    Scanning 5.9 GHz DSRC / C-V2X emergency vehicle beacons and local weather hazards. 0 emergency transponders within 1.5 miles.
                  </p>
                </div>
              )}

              {activeTab === 'settings' && (
                <div className="w-full max-w-lg bg-slate-900/90 border border-slate-700 rounded-xl p-4 text-xs flex items-center justify-between">
                  <span className="text-slate-300">Autonomous Speed Drift Simulation</span>
                  <button
                    onClick={() => setAutoSim(!autoSim)}
                    className={`px-3 py-1 rounded font-bold cursor-pointer ${autoSim ? 'bg-emerald-500 text-slate-950' : 'bg-slate-700 text-white'}`}
                  >
                    {autoSim ? 'ENABLED' : 'PAUSED'}
                  </button>
                </div>
              )}

              {/* Positive Streak Banner */}
              <div className="w-full max-w-lg bg-emerald-950/40 border border-emerald-500/30 px-4 py-2.5 rounded-lg flex items-center justify-between text-xs">
                <span className="text-emerald-300">Safe Driving & Compliance Streak Active</span>
                <span className="text-emerald-400 font-bold">+15 PTS / MI</span>
              </div>
            </div>

            {/* Bottom HUD Mode Selector */}
            <div className="grid grid-cols-4 gap-2.5 mt-4 max-w-lg mx-auto">
              {[
                { id: 'vehicle', label: 'Vehicle', icon: 'car' },
                { id: 'rights', label: 'Rights', icon: 'shield' },
                { id: 'scanner', label: 'Scanner', icon: 'eye' },
                { id: 'settings', label: 'Settings', icon: 'settings' },
              ].map((tab) => {
                const isActive = activeTab === tab.id;
                return (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    className={`p-3 rounded-xl flex flex-col items-center space-y-1.5 border transition cursor-pointer ${
                      isActive
                        ? 'bg-cyan-950/70 border-cyan-400 text-cyan-300'
                        : 'bg-slate-900/80 border-slate-800 text-slate-400 hover:border-slate-600'
                    }`}
                  >
                    <Icon name={tab.icon} className="w-5 h-5" />
                    <span className="text-[11px]">{tab.label}</span>
                  </button>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // MODULE 3: GUARDIAN PROTOCOL (6 SCENARIOS)
    // ==========================================
    const IMPAIRMENT_SCENARIOS = {
      alcohol: {

                    <Icon name="heart" className="w-10 h-10 text-emerald-400" />
                  </div>
                  <h2 className="text-2xl font-bold text-emerald-400">You Made It Home Safely</h2>
                  <p className="text-slate-400 text-sm mt-1">
                    Private Telemetry Review • Profile: <span className="text-white font-semibold">{scenario.name}</span>
                  </p>
                </div>

                {/* Biometric Capacity Breakdown */}
                <div className="rounded-2xl border border-slate-800 bg-[#091522] p-6">
                  <h3 className="text-lg font-bold text-white mb-4 flex items-center">
                    <Icon name="brain" className="w-5 h-5 mr-2 text-cyan-400" />
                    Measured Driving Capacity During Trip
                  </h3>
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                    {Object.entries(scenario.metrics).map(([key, value]) => (
                      <div key={key} className="bg-slate-900/90 border border-slate-800 p-4 rounded-xl">
                        <div className="text-xs text-slate-400 mb-2 capitalize">
                          {key.replace(/([A-Z])/g, ' $1').trim()}
                        </div>
                        <div className="flex items-center space-x-2">
                          <div className="flex-1 bg-slate-800 rounded-full h-2">
                            <div
                              className={`h-2 rounded-full ${
                                value < 45 ? 'bg-rose-500' : value < 70 ? 'bg-amber-400' : 'bg-emerald-400'
                              }`}
                              style={{ width: `${value}%` }}
                            ></div>
                          </div>
                          <span className="text-white font-mono text-sm font-bold">{value}%</span>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                {/* Critical Interventions */}
                <div className="rounded-2xl border border-slate-800 bg-[#091522] p-6 space-y-4">
                  <h3 className="text-lg font-bold text-white flex items-center">
                    <Icon name="alert-triangle" className="w-5 h-5 mr-2 text-amber-400" />
                    Critical Interventions Executed
                  </h3>
                  {scenario.interventions.map((item, i) => (
                    <div key={i} className="bg-rose-950/25 border border-rose-500/40 rounded-xl p-4">
                      <div className="font-bold text-rose-300 text-sm mb-1">{item.title}</div>
                      <p className="text-xs md:text-sm text-slate-300 mb-2">{item.detail}</p>
                      <div className="text-xs font-mono text-rose-400">Baseline Risk: {item.risk}</div>
                    </div>
                  ))}
                </div>

                {/* Alternate Reality Toggle */}
                <button
                  onClick={() => setShowComparison(!showComparison)}
                  className="w-full bg-slate-800 hover:bg-slate-700 border border-cyan-500/40 text-cyan-300 p-4 rounded-xl font-bold text-sm transition cursor-pointer"
                >
                  {showComparison ? 'Hide Alternate Reality Comparison' : 'Compare: What Would Have Happened Without Guardian'}
                </button>

                {showComparison && (
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div className="rounded-2xl border border-rose-500/40 bg-rose-950/20 p-5 space-y-2">
                      <div className="font-bold text-rose-400 flex items-center text-sm">
                        <Icon name="alert-octagon" className="w-4 h-4 mr-2" />
                        Without Guardian Protocol
                      </div>
                      <ul className="space-y-1.5 text-xs text-slate-300">
                        <li>• High probability of severe or fatal collision</li>
                        <li>• Felony DUI / vehicular assault exposure (5–15 yrs)</li>
                        <li>• $500,000+ uncovered civil & medical liability</li>
                        <li>• Permanent career & license revocation</li>
                      </ul>
                    </div>
                    <div className="rounded-2xl border border-emerald-500/40 bg-emerald-950/20 p-5 space-y-2">
                      <div className="font-bold text-emerald-400 flex items-center text-sm">
                        <Icon name="check-circle" className="w-4 h-4 mr-2" />
                        Actual Outcome With Guardian
                      </div>
                      <ul className="space-y-1.5 text-xs text-slate-300">
                        <li>✓ Zero injuries to driver, pedestrians, or motorists</li>
                        <li>✓ Zero vehicle or municipal property damage</li>
                        <li>✓ Complete privacy preserved — no criminal record</li>
                        <li>✓ Opportunity for safe, supported recovery</li>
                      </ul>
                    </div>
                  </div>
                )}

                {/* Empathetic Closing & Interactive Actions */}
                <div className="rounded-2xl border border-cyan-500/30 bg-cyan-950/20 p-6 space-y-4">
                  <h3 className="text-lg font-bold text-cyan-300">Moving Forward — Zero Judgment</h3>
                  <p className="text-sm text-slate-300">{scenario.debriefNote}</p>

                  {activeActionToast && (
                    <div className="p-3 rounded-lg bg-emerald-950/80 border border-emerald-400 text-emerald-300 text-xs font-mono">
                      ✓ {activeActionToast}
                    </div>
                  )}

                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 pt-2">
                    <button
                      onClick={() => setActiveActionToast('Confidential SAMHSA & local recovery specialist directory unlocked.')}
                      className="bg-emerald-600 hover:bg-emerald-500 text-white p-3 rounded-xl text-xs font-bold transition cursor-pointer"
                    >
                      Confidential Support Resources
                    </button>
                    <button
                      onClick={() => setActiveActionToast('Guardian Auto-Prevention Lock armed for evening hours.')}
                      className="bg-cyan-600 hover:bg-cyan-500 text-slate-950 p-3 rounded-xl text-xs font-bold transition cursor-pointer"
                    >
                      Enable Auto-Prevention Lock
                    </button>
                    <button
                      onClick={() => setActiveActionToast('Trusted contact safe-arrival notification configured.')}
                      className="bg-slate-800 hover:bg-slate-700 border border-slate-600 text-white p-3 rounded-xl text-xs font-bold transition cursor-pointer"
                    >
                      Configure Trusted Contact
                    </button>
                  </div>

                  <div className="pt-2 text-center">
                    <button
                      onClick={() => setStage('start')}
                      className="text-xs font-mono text-cyan-400 hover:text-cyan-300 underline cursor-pointer"
                    >
                      Reset or Test Another Impairment Scenario
                    </button>
                  </div>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ==========================================
    // UNIFIED NEXUS SUITE SHELL
    // ==========================================
    function App() {
      const [activeModule, setActiveModule] = useState('guardian');

      const navItems = [
        {
          id: 'telemetry',
          label: 'NEXUS Command Telemetry',
          sub: 'Core Sync & System Health',
          icon: 'activity',
        },
        {
          id: 'hud',
          label: 'Active Hazard HUD',
          sub: 'Live Collision & Speed Shield',
          icon: 'navigation',
        },
        {
          id: 'guardian',
          label: 'Guardian Protocol',
          sub: '6 Impairment Intervention Demos',
          icon: 'shield',
        },
      ];

      return (
        <div className="min-h-screen bg-[#050b14] text-slate-100 flex flex-col">
          {/* Top Enterprise Header */}
          <header className="border-b border-cyan-500/25 bg-[#07111e]/95 backdrop-blur sticky top-0 z-40">
            <div className="max-w-6xl mx-auto px-4 py-4 flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
              <div className="flex items-center space-x-3">
                <div className="w-10 h-10 rounded-xl bg-cyan-500/15 border border-cyan-400/50 flex items-center justify-center shadow-[0_0_20px_rgba(34,211,238,0.3)]">
                  <Icon name="shield" className="w-6 h-6 text-cyan-300" />
                </div>
                <div>
                  <div className="flex items-center space-x-2">
                    <span className="text-xl font-bold tracking-[0.22em] text-cyan-300 uppercase">NEXUS</span>
                    <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-cyan-500/10 border border-cyan-400/30 text-cyan-300">
                      OEM SUITE v2.4
                    </span>
                  </div>
                  <p className="text-xs text-slate-400 tracking-wide">
                    Integrated Intelligence Solutions • Automotive & Sovereign Safety Platform
                  </p>
                </div>
              </div>

              {/* Unified Module Switcher */}
              <nav className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                {navItems.map((item) => {
                  const isActive = activeModule === item.id;
                  return (
                    <button
                      key={item.id}
                      onClick={() => setActiveModule(item.id)}
                      className={`px-3.5 py-2.5 rounded-xl border text-left flex items-center space-x-2.5 transition cursor-pointer ${
                        isActive
                          ? 'bg-cyan-500/15 border-cyan-400 text-white shadow-[0_0_20px_rgba(34,211,238,0.2)]'
                          : 'bg-slate-900/70 border-slate-800 text-slate-400 hover:border-slate-700 hover:text-slate-200'
                      }`}
                    >
                      <Icon name={item.icon} className={`w-4 h-4 shrink-0 ${isActive ? 'text-cyan-300' : 'text-slate-500'}`} />
                      <div className="min-w-0">
                        <div className="text-xs font-bold truncate">{item.label}</div>
                        <div className="text-[10px] text-slate-400 truncate">{item.sub}</div>
                      </div>
                    </button>
                  );
                })}
              </nav>
            </div>
          </header>

          {/* Active Workspace */}
          <main className="flex-1 max-w-6xl w-full mx-auto px-4 py-6">
            {activeModule === 'telemetry' && <CommandTelemetryModule />}
            {activeModule === 'hud' && <HazardHudModule />}
            {activeModule === 'guardian' && <GuardianProtocolModule />}
          </main>

          {/* Enterprise Footer */}
          <footer className="border-t border-slate-900 py-4 px-4 text-center">
            <p className="text-[11px] font-mono tracking-[0.2em] text-cyan-400/70 uppercase">
              NEXUS Integrated Intelligence Solutions • Where Code Meets Consciousness
            </p>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
