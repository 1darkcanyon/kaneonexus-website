function esc(s){return (s||"").replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
function copyText(t,flagId){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){flash(flagId)})}else{var ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand("copy")}catch(e){}document.body.removeChild(ta);flash(flagId)}}
function flash(id){var el=document.getElementById(id);if(!el)return;el.classList.add("show");setTimeout(function(){el.classList.remove("show")},1300)}
function ls_get(k,d){try{var v=JSON.parse(localStorage.getItem(k));return v||d}catch(e){return d}}

tactics:"Keep asking for \"proof\" before sending anything. Claim his bank flagged the transfer. Drag out onboarding one step at a time.",
limits:"Never actually connect a wallet or send funds, including small \"test\" amounts."},
{id:"pat",name:"Pat Ostrander",tag:"Business email compromise",sub:"45, owns a small landscaping company",
backstory:"Pat runs a five-person company and handles the books personally, overwhelmed and often replying to email from a phone between job sites. Scammers impersonating vendors or \"the boss\" count on Pat being too busy to double-check.",
traits:"Brief, business-like replies, mentions being on-site, asks for things in writing \"for the file.\"",
lines:["Got it, can you resend that invoice as a PDF for my records?","Tight on cash this week, can it wait til Friday payroll?","Who approved this change, I don't see it in our thread with Dana."],
tactics:"Insist on verifying any payment change by a second channel. Ask for details that don't exist to expose the scam.",
limits:"Never actually change real payment details or send funds, even \"to test.\""}
];
var B_open={};
function B_personas(){
var h='<div class="warnbox"><h2>Hook, line, and stay safe</h2><ul><li>Never give a real name, address, account number, password, or code — invent everything.</li><li>Never send money, gift cards, or crypto, and never click or install anything they send.</li><li>Keep a log — screenshots or copies, with timestamps — it\'s what makes this useful for the Report tab.</li><li>Stay in conversation only; don\'t try to access or disrupt their systems.</li><li>If it turns threatening, disengage and block. The goal is wasting their time, not winning a fight.</li></ul></div>';
h+='<h2>The bait crew</h2><div class="acc">';
B_CAST.forEach(function(p,i){
var open=!!B_open[i];
h+='<div class="accitem" data-open="'+open+'"><button class="ahead" data-act="toggle" data-i="'+i+'"><span class="aid"><b>'+p.name+'</b><span>'+p.sub+'</span></span><span class="tag">'+p.tag+'</span><span class="chev">▾</span></button>';
h+='<div class="abody"><h4>Backstory</h4><p>'+p.backstory+'</p><h4>How they talk</h4><p>'+p.traits+'</p><h4>Sample lines</h4><div class="lines">'+p.lines.map(function(l){return '<p>“'+l+'”</p>'}).join("")+'</div><h4>Stalling tactics</h4><p>'+p.tactics+'</p><h4>Hard limits</h4><p class="limits">'+p.limits+'</p></div></div>'});
h+='</div>';
return h}

var B_STALL=["Can you give me a minute, I'm in the middle of something.","Sorry, can you explain that part again?","That sounds like a lot, let me think about it.","Hang on, I want to write this down first.","Can you send that again, I want to make sure I have it right."];
var B_ASK=["Why do you need that exactly?","How does that actually work?","Can you tell me more about your company first?","Who else have you worked with on this?"];
var H_KEY="sh-honeypot-log";
var H_log=ls_get(H_KEY,[]);
var H_sug=null;
function H_setup(){
var h='<h2>1. Bait the hook</h2><ol class="steps"><li>Create a free webmail address with no real details — this is your persona\'s inbox, nothing else.</li><li>Optionally add a free second phone number for text scams, off your real contacts.</li><li>Pick a Bait Crew persona to go with it, and keep their details consistent.</li></ol>';
h+='<h2>2. Let the current carry them in</h2><ol class="steps"><li>Reply (safely, from the decoy) to spam that already lands in a throwaway inbox — that alone attracts more.</li><li>Use the decoy email on a few mailing-list signups you don\'t mind.</li><li>If you post it publicly, follow that platform\'s rules — don\'t create listings that could deceive a real person.</li></ol>';
h+='<h2>3. Work the net</h2><p>When something phishy bites, switch to the Reply desk below, pick your persona, and log the exchange. Send anything serious over to the Report tab.</p>';
return h}
function H_desk(){
var h='<label for="persona">Persona</label><select id="persona">';
B_CAST.forEach(function(p){h+='<option value="'+p.id+'">'+p.name+' — '+p.tag+'</option>'});
h+='</select><label for="them">What they just said</label><textarea id="them" placeholder="Paste the scammer\'s latest message"></textarea><button class="cta" data-act="suggest">Suggest a reply</button>';
if(H_sug){
h+='<div class="suggest"><p>“'+esc(H_sug)+'”</p><div class="row"><button class="small" data-act="copysug">Copy</button><span class="copied" id="copiedsug">Copied</span><button class="small" data-act="another">Try another</button></div></div>';
h+='<button class="cta ghost" data-act="logit">Log this exchange</button>';
}
h+='<h2 style="margin-top:22px">The log</h2>';
if(!H_log.length)h+='<div class="empty">Nothing in the net yet — exchanges you log will show up here.</div>';
else{H_log.slice().reverse().forEach(function(e){h+='<div class="log"><div class="top"><span class="badge">'+e.persona+'</span><span>'+e.when+'</span></div><div class="them">Them: '+esc(e.them)+'</div><div class="us">You: '+esc(e.us)+'</div></div>'})}
return h}
function H_gen(pid){
var p=B_CAST.filter(function(x){return x.id===pid})[0];
var pool=p.lines.concat(B_STALL,B_ASK);
return pool[Math.floor(Math.random()*pool.length)]}

var R_KEY="sh-report-history";
var R_history=ls_get(R_KEY,[]);
var R_draft=null;
function R_form(){
var h='<h2>Land the paperwork</h2><p class="lede">Fill in what you know — this builds ready-to-send reports, nothing sends itself.</p>';
h+='<label for="ch">How did it reach you?</label><select id="ch"><option>Email</option><option>Text message</option><option>Phone call</option><option>Social media</option><option>QR code</option><option>Other</option></select>';
h+='<label for="imp">Who is it pretending to be?</label><input id="imp" type="text" placeholder="e.g. a bank, a delivery company">';
h+='<label for="from">Sender address, number, or username</label><input id="from" type="text">';
h+='<label for="link">Suspicious link or phone number, if any</label><input id="link" type="text">';
h+='<label for="ask">What did it ask you to do?</label><input id="ask" type="text">';
h+='<label for="msg">Message text</label><textarea id="msg" placeholder="Paste the email or text here"></textarea>';
h+='<label for="date">Date received</label><input id="date" type="date">';
h+='<button class="cta" id="rgo">Build my report</button>';
return h}
function R_dest(d){
var subj="Phishing report: "+(d.imp||"unknown sender");
var body="Channel: "+d.ch+"\nImpersonating: "+(d.imp||"unknown")+"\nSender: "+(d.from||"unknown")+"\nSuspicious link/number: "+(d.link||"none given")+"\nAsked me to: "+(d.ask||"not specified")+"\nDate received: "+(d.date||"not specified")+"\n\nMessage text:\n"+(d.msg||"(not provided)");
var list=[];
list.push({name:"FTC — ReportFraud.ftc.gov",desc:"The US government's central scam-reporting site. Helps them track patterns nationwide.",href:"https://reportfraud.ftc.gov/",label:"Open ReportFraud.ftc.gov",body:body});
list.push({name:"Anti-Phishing Working Group",desc:"A global coalition that collects phishing emails to help block them for everyone.",href:"mailto:reportphishing@apwg.org?subject="+encodeURIComponent(subj)+"&body="+encodeURIComponent(body+"\n\n(Forward the original email as an attachment if your email app supports it.)"),label:"Open email to APWG",body:body});
if(d.ch==="Text message")list.push({name:"Forward to 7726 (SPAM)",desc:"In the US, forwarding a phishing text to 7726 reports it to your carrier at no charge.",href:null,label:null,body:"Forward the original text message to 7726."});
if(d.imp)list.push({name:"The real "+d.imp,desc:"Search \""+d.imp+" report phishing\" and use their official site, not any link from the message.",href:"https://www.google.com/search?q="+encodeURIComponent(d.imp+" report phishing"),label:"Search for their report page",body:body});
list.push({name:"Your email or phone provider",desc:"The built-in \"Report phishing\" or \"Report junk\" button on the message is often the fastest route.",href:null,label:null,body:null});
return list}
function R_result(d){
var dests=R_dest(d);
var h='<h2>Catch logged</h2>';
h+='<div class="card"><h3>Summary</h3><pre id="summarytext">'+esc(dests[0].body)+'</pre><div class="row"><button class="small" data-act="copysum">Copy summary</button><span class="copied" id="copiedsum">Copied</span></div></div>';
dests.forEach(function(x,idx){
h+='<div class="card"><h3>'+x.name+'</h3><p>'+x.desc+'</p><div class="row">';
if(x.href)h+='<a class="go" href="'+x.href+'" target="_blank" rel="noopener">'+x.label+'</a>';
if(x.body)h+='<button class="small" data-act="rcopy" data-i="'+idx+'">Copy details</button><span class="copied" id="rcopied'+idx+'">Copied</span>';
h+='</div></div>'});
h+='<button class="cta" id="rsave">Save to history &amp; report another</button><button class="cta ghost" id="rback">Edit this report</button>';
return h}
function R_hist(){
if(!R_history.length)return '<div class="empty">No saved reports yet — the ones you save will show up here to track.</div>';
var h="";
R_history.slice().reverse().forEach(function(r,ri){
var i=R_history.length-1-ri;
h+='<div class="hist"><div class="top"><span>'+(r.date||"no date")+' · '+r.ch+'</span><span>'+r.when+'</span></div><div class="snip">'+esc(r.imp||"Unknown sender")+'</div><div class="chk">';
["ftc","apwg","provider"].forEach(function(k,ki){var labels=["Reported to FTC","Reported to APWG","Reported to provider"];h+='<label><input type="checkbox" data-hist="'+i+'" data-k="'+k+'" '+(r.status&&r.status[k]?"checked":"")+'>'+labels[ki]+'</label>'});
h+='</div></div>'});
return h}
function R_tab(){
if(R_draft&&R_draft.view==="result")return R_result(R_draft)+'<h2 style="margin-top:22px">History</h2>'+R_hist();
return R_form()+'<h2 style="margin-top:22px">History</h2>'+R_hist()}

function O_card(kicker,title,desc,top,sub,cta){return '<div class="card"><div class="kicker">'+kicker+'</div><h3>'+title+'</h3><p>'+desc+'</p><button class="go" data-act="goto" data-top="'+top+'" data-sub="'+sub+'">'+cta+'</button></div>'}
function O_view(){
var h='<h2>Four tools, zero mercy</h2><p class="lede">Learn it, catch it, bait it, report it — the whole shoal in one spot.</p><div class="grid">';
h+=O_card("LEARN & TEST","Lures 101 + Reel Test","Six warning signs plus a simulator with realistic emails, texts and pop-ups.","learn","lessons","Start learning");
h+=O_card("BAIT CREW","Four personas","Characters built to waste a scammer's time and draw out their methods.","bait","personas","Meet the crew");
h+=O_card("BAIT CREW","Honeypot Desk","Set up a decoy, log what bites, get in-character reply suggestions.","bait","honeypot","Open the desk");
h+=O_card("CLOSE THE LOOP","Report the Phish","Turns a catch into ready-to-send reports for the FTC and APWG.","report","","Report a catch");
h+='</div><div class="note">Baiting a scammer means wasting their time and gathering evidence — never sending money, clicking their links, or touching their systems. Ground rules are in the Bait tab.</div>';
return h}

function renderNav(){
var th=document.getElementById("topnav");
th.innerHTML=TOPS.map(function(t){return '<button role="tab" data-top="'+t[0]+'" aria-selected="'+(TOP===t[0])+'">'+t[1]+'</button>'}).join("");
var sn=document.getElementById("subnav");
var subs=SUBS[TOP]||[];
if(!subs.length){sn.innerHTML="";sn.style.display="none";return}
sn.style.display="flex";
sn.innerHTML=subs.map(function(s){return '<button role="tab" data-sub="'+s[0]+'" aria-selected="'+(SUB===s[0])+'">'+s[1]+'</button>'}).join("")}
function render(){
if(TOP==="learn"&&!SUB)SUB="lessons";
if(TOP==="bait"&&!SUB)SUB="personas";
if(TOP!=="learn"&&TOP!=="bait")SUB="";
renderNav();
var app=document.getElementById("app");
if(TOP==="overview")app.innerHTML=O_view();
else if(TOP==="learn")app.innerHTML=SUB==="sim"?L_sim():L_lessons();
else if(TOP==="bait")app.innerHTML=SUB==="honeypot"?(H_setup()+'<h2 style="margin-top:22px">Reply desk</h2>'+H_desk()):B_personas();
else app.innerHTML=R_tab();
window.scrollTo(0,0)}
function goto(top,sub){TOP=top;SUB=sub||"";render()}

document.addEventListener("click",function(e){
var b=e.target.closest("button,a");if(!b)return;
if(b.dataset.top&&!b.dataset.act){goto(b.dataset.top,"");return}
if(b.dataset.sub&&!b.dataset.act){SUB=b.dataset.sub;render();return}
var a=b.dataset.act;
if(a==="goto"){goto(b.dataset.top,b.dataset.sub);return}
if(a==="tosim"){goto("learn","sim");return}
if(a==="tolessons"){goto("learn","lessons");return}
if(a==="peek"){L_peek=!L_peek;var y=window.scrollY;render();window.scrollTo(0,y);return}
if(a==="ans"&&L_picked===null){L_picked=b.dataset.v==="1";var m=L_order[L_i];if(L_picked===m.phish)L_score++;else L_missed.push(m);var y2=window.scrollY;render();window.scrollTo(0,y2);return}
if(a==="next"){L_i++;L_picked=null;L_peek=false;render();return}
if(a==="again"){L_start();render();return}
if(a==="toggle"){var i=b.dataset.i;B_open[i]=!B_open[i];render();return}
if(a==="suggest"||a==="another"){var pid=document.getElementById("persona").value;H_sug=H_gen(pid);var them=document.getElementById("them").value;render();setTimeout(function(){document.getElementById("persona").value=pid;document.getElementById("them").value=them},0);return}
if(a==="copysug"){copyText(H_sug,"copiedsug");return}
if(a==="logit"){var pid2=document.getElementById("persona").value;var pname=B_CAST.filter(function(x){return x.id===pid2})[0].name;var them2=document.getElementById("them").value;H_log.push({persona:pname,them:them2,us:H_sug,when:new Date().toLocaleString()});ls_set(H_KEY,H_log);H_sug=null;render();return}
if(b.id==="rgo"){R_draft={view:"result",ch:document.getElementById("ch").value,imp:document.getElementById("imp").value.trim(),from:document.getElementById("from").value.trim(),link:document.getElementById("link").value.trim(),ask:document.getElementById("ask").value.trim(),msg:document.getElementById("msg").value.trim(),date:document.getElementById("date").value};render();return}
if(b.id==="rback"){R_draft=null;render();return}
if(a==="copysum"){copyText(document.getElementById("summarytext").textContent,"copiedsum");return}
if(a==="rcopy"){var dests=R_dest(R_draft);var x=dests[+b.dataset.i];copyText(x.body,"rcopied"+b.dataset.i);return}
if(b.id==="rsave"){R_history.push({ch:R_draft.ch,imp:R_draft.imp,date:R_draft.date,when:new Date().toLocaleDateString(),status:{}});ls_set(R_KEY,R_history);R_draft=null;render();return}
});
document.addEventListener("change",function(e){
var cb=e.target;if(cb.tagName!=="INPUT"||cb.type!=="checkbox"||cb.dataset.hist===undefined)return;
var i=+cb.dataset.hist,k=cb.dataset.k;
R_history[i].status=R_history[i].status||{};
R_history[i].status[k]=cb.checked;
ls_set(R_KEY,R_history)});
render();
</script>
